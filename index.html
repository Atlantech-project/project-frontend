<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#083A4F" />
    <link rel="icon" href="/brand/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/icons/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/icons/site.webmanifest" />
    <title>ATLANTECH</title>
    <style>
      .atl-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #083a4f;
      }
      .atl-boot img {
        border-radius: 16px;
        animation: atl-boot-bob 2.4s ease-in-out infinite;
      }
      .atl-boot span {
        width: 96px;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, #407e8c, #a58d66, #c0d5d6, #407e8c) 0 0 / 300% 100%;
        animation: atl-boot-wave 1.6s linear infinite;
      }
      @keyframes atl-boot-bob {
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes atl-boot-wave {
        to {
          background-position: 300% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .atl-boot img,
        .atl-boot span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown while the app and config.json load; Vue replaces it on mount. -->
    <div id="app">
      <div class="atl-boot" role="status" aria-label="Loading ATLANTECH">
        <img src="/brand/icons/icon-192.png" alt="" width="72" height="72" />
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
